# Every push runs what a person would run before shipping.
#
# The point is not ceremony. Four of the bugs found late in this project would
# have been caught here, and the two most expensive ones — a leaderboard sorted
# as text, and cron endpoints that 405 on the verb their scheduler uses — fail
# nothing visibly. They just do the wrong thing quietly. That is exactly what a
# suite is for, and running it by hand is how it stops happening.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The SQL suite needs a real Postgres. Row level security, the security
    # definer functions and the money-handling rules cannot be checked against
    # anything less, which is the whole reason they are tested this way.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Database rules
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          ./supabase/test/run.sh
          # The app and the database both work out what a chore is worth. This
          # runs the real calcReward and the real award_for_submission over
          # three thousand combinations and fails if they ever disagree.
          npm run test:awards

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=local-anon-key\nVITE_GUILDS_ENABLED=true\n' > .env.local
          node supabase/test/mock-server.mjs &
          npm run dev -- --port 5173 &
          npx wait-on http://localhost:5173 http://localhost:54321/rest/v1/ --timeout 60000 || sleep 15

      - name: The app, end to end
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          npm run test:smoke
          npm run test:sync

      # The serverless functions hold every secret in the product, and until
      # this step nothing exercised them at all. They run under workerd here
      # rather than Node, because workerd is what actually serves them in
      # production and the two are not the same runtime.
      - name: The server endpoints, under the runtime that serves them
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          # One call, one PAIR. Two calls would hand out a public key and a
          # private key from different pairs, and web-push rejects that.
          node -e "const k=require('web-push').generateVAPIDKeys();console.log(k.publicKey);console.log(k.privateKey)" > /tmp/vapid.txt
          npx wrangler pages dev dist --port 8788 --compatibility-flags nodejs_compat \
            --binding SUPABASE_URL=http://localhost:54321 \
            --binding SUPABASE_SERVICE_ROLE_KEY=service-role-key \
            --binding CRON_SECRET=test-cron-secret \
            --binding STRIPE_SECRET_KEY=sk_test_routing_only \
            --binding ANTHROPIC_API_KEY=sk-ant-test-routing-only \
            --binding VAPID_PUBLIC_KEY=$(sed -n 1p /tmp/vapid.txt) \
            --binding VAPID_PRIVATE_KEY=$(sed -n 2p /tmp/vapid.txt) \
            --binding VAPID_SUBJECT=mailto:test@example.com &
          npx wait-on http://localhost:8788/ --timeout 90000 || sleep 20
          npm run test:api

      - name: Screenshots from the failure, if there was one
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
