# Every push runs what a person would run before shipping.
#
# The point is not ceremony. Four of the bugs found late in this project would
# have been caught here, and the two most expensive ones — a leaderboard sorted
# as text, and cron endpoints that 405 on the verb their scheduler uses — fail
# nothing visibly. They just do the wrong thing quietly. That is exactly what a
# suite is for, and running it by hand is how it stops happening.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch cancels the run it replaces, so CI time
# goes on the code that is actually there now.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The browser suites alone take over half an hour: 27 of them, each a
    # real browser driving the real app. Twenty minutes cut them off.
    timeout-minutes: 75

    # The SQL suite needs a real Postgres. Row level security, the security
    # definer functions and the money-handling rules cannot be checked against
    # anything less, which is the whole reason they are tested this way.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Database rules
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          ./supabase/test/run.sh
          # The app and the database both work out what a chore is worth. This
          # runs the real calcReward and the real award_for_submission over
          # three thousand combinations and fails if they ever disagree.
          npm run test:awards

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # Every other browser suite drives the dev server, which has no
      # Content-Security-Policy. This one builds the app, checks no server
      # secret reached it and the policy allows only what is listed, then
      # plays the arcade's framed games under that policy, online and
      # offline — all four once shipped refused by it while everything here
      # passed.
      - name: The production build — no secrets, the policy, the framed games
        run: npm run test:built

      - name: Start the stack
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          printf 'VITE_SUPABASE_URL=http://localhost:54321\nVITE_SUPABASE_ANON_KEY=local-anon-key\nVITE_GUILDS_ENABLED=true\n' > .env.local
          node supabase/test/mock-server.mjs &
          npm run dev -- --port 5173 &
          npx wait-on http://localhost:5173 http://localhost:54321/rest/v1/ --timeout 60000 || sleep 15

      - name: The app, end to end
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          npm run test:smoke
          npm run test:sync

      # The serverless functions hold every secret in the product, and until
      # this step nothing exercised them at all. They run under workerd here
      # rather than Node, because workerd is what actually serves them in
      # production and the two are not the same runtime.
      - name: The server endpoints, under the runtime that serves them
        env:
          PGHOST: localhost
          PGPORT: '55432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          # The same settings up.sh --cf uses, from one place: CI had its own
          # copy of this list, and it fell behind the suite.
          bash supabase/test/serve-functions.sh &
          npx wait-on http://localhost:8788/ --timeout 90000 || sleep 20
          STATS_KEY_FOR_TEST=test-stats-key npm run test:api

      - name: Screenshots from the failure, if there was one
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/screenshots/
          if-no-files-found: ignore
