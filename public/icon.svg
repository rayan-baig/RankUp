<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RankUp">
  <!--
    A guild shield carrying two rank chevrons, the upper one gold because it is
    the rank just earned. Chevrons are what ranking up looks like — an arrow
    means upload — and the shield is the object the game already trades in.

    Two chevrons, not three: the third turned to mush at 16px, which is the size
    a browser tab actually draws this at. Everything sits inside a circle of
    radius 205 about the centre, the safe zone Android crops icons to.
  -->
  <rect width="512" height="512" rx="114" fill="#141a33"/>
  <path d="M256 92 L396 146 V274 Q396 378 256 432 Q116 378 116 274 V146 Z"
        fill="#1d2750" stroke="#4d8dff" stroke-width="18" stroke-linejoin="round"/>
  <g fill="none" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 336 L256 282 L332 336" stroke="#4d8dff"/>
    <path d="M180 258 L256 204 L332 258" stroke="#ffc23d"/>
  </g>
</svg>
