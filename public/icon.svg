<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RankUp">
  <!--
    Three rank chevrons, stacked. Chevrons are what "rank up" actually looks
    like — an arrow means upload. The top one is gold because it is the one just
    earned; the two beneath it are the ranks already behind you.

    Every stroke sits inside a circle of radius 205 around the centre, which is
    the safe zone Android masks icons to. The old icon did not, so it was being
    cropped on the one platform that crops.
  -->
  <rect width="512" height="512" rx="114" fill="#141a33"/>
  <g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M156 380 L256 324 L356 380" stroke="#37477a"/>
    <path d="M156 306 L256 250 L356 306" stroke="#5b7ce0"/>
    <path d="M156 232 L256 176 L356 232" stroke="#f2b03d"/>
  </g>
</svg>
