<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RankUp">
  <!--
    The maskable cut. Same mark, drawn smaller and edge to edge: the platform
    supplies the shape (circle, squircle, rounded square) and crops to it, so
    this must not carry corners of its own and must keep everything well inside
    the central 80% circle.
  -->
  <rect width="512" height="512" fill="#141a33"/>
  <g fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 362 L256 317 L336 362" stroke="#37477a"/>
    <path d="M176 302 L256 257 L336 302" stroke="#5b7ce0"/>
    <path d="M176 242 L256 197 L336 242" stroke="#f2b03d"/>
  </g>
</svg>
