<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="RankUp">
  <!--
    The maskable cut: same mark, edge to edge and drawn a little smaller. The
    platform supplies the shape and crops to it, so this carries no corners of
    its own and nothing important goes outside the safe circle.
  -->
  <defs>
    <linearGradient id="rum-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#4A22C9"/>
      <stop offset="1" stop-color="#1B0B48"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#rum-bg)"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)"
     fill="none" stroke-width="50" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 358 L256 300 L354 358" stroke="#FFFFFF" stroke-opacity="0.92"/>
    <path d="M158 212 L256 154 L354 212" stroke="#FFC93D"/>
  </g>
</svg>
