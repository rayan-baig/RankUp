<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="RankUp — turn everyday chores into a game kids actually want to play." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <!-- Bookmark bars, Windows shortcuts and older browsers still ask for this. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <!-- iOS ignores the manifest icons when you add to the home screen. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- What a link to RankUp looks like when it is pasted anywhere: a text
         message, a TikTok bio, a Facebook post. For most people this card is
         the first thing they will ever see of the app. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RankUp" />
    <meta property="og:title" content="RankUp — chores, but a game" />
    <meta property="og:description" content="Your kid does the chore, photographs the proof, and the app checks it before you ever look. They earn XP. You stop nagging." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RankUp — chores, but a game" />
    <meta name="twitter:description" content="Your kid does the chore, photographs the proof, and the app checks it before you ever look." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <title>RankUp</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
