<style>
/* The artwork is the design, untouched and full-bleed. Everything here is
   positioning and hit areas laid over it, in percentages, so the hotspots
   stay on their targets at any width. Single-theme dark by design. */
:root {
  --void: #05060f;
  --cyan: #35d0ff;
  --ink: #ffffff;
  --ink-dim: #a9b8d8;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--void);
  color: var(--ink);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--void);
}

.stage { position: relative; width: 100%; max-width: 1671px; margin: 0 auto; }
.shot { position: relative; display: block; width: 100%; height: auto; }

/* A hit area over the artwork. Invisible until you point at it, then it
   lights the thing you are about to open rather than covering it. */
.hit {
  position: absolute;
  z-index: 3;
  display: block;
  border-radius: 14px;
  border: 2px solid transparent;
  background: transparent;
  cursor: pointer;
  padding: 0;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
}
.hit:hover, .hit:focus-visible {
  border-color: var(--glow, var(--cyan));
  box-shadow: 0 0 28px -4px var(--glow, var(--cyan)), inset 0 0 40px -18px var(--glow, var(--cyan));
  background: rgba(255, 255, 255, 0.04);
  outline: none;
}
.hit .tip {
  position: absolute; left: 50%; bottom: -34px; transform: translateX(-50%);
  white-space: nowrap; opacity: 0; pointer-events: none;
  background: rgba(5, 8, 22, 0.95); border: 1px solid var(--glow, var(--cyan));
  color: #fff; font-size: 12px; font-weight: 600;
  padding: 5px 11px; border-radius: 999px;
  transition: opacity .15s ease;
}
.hit:hover .tip, .hit:focus-visible .tip { opacity: 1; }
.hit.small { border-radius: 999px; }

/* The one control that is not part of the artwork: a way back and forth
   between the two screens, and a plain way into RankUp on a phone where
   hovering a hotspot is not a thing. */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: rgba(5, 6, 15, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(70, 120, 220, 0.22);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.seg {
  display: inline-flex; background: rgba(14, 22, 52, 0.8);
  border: 1px solid rgba(70, 120, 220, 0.3); border-radius: 999px; padding: 3px;
}
.seg button {
  appearance: none; background: none; border: 0; border-radius: 999px;
  color: var(--ink-dim); font: 600 13px var(--font);
  padding: 8px 16px; cursor: pointer; white-space: nowrap;
}
.seg button[aria-selected="true"] {
  background: linear-gradient(97deg, #22b8ff, #3b6ef5 55%, #7c5cf0);
  color: #fff;
}
.open {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 8px;
  border-radius: 999px; padding: 10px 20px; text-decoration: none;
  font: 700 13.5px var(--font); color: #04240f;
  background: linear-gradient(97deg, #2ee68a, #0f9f5c);
  box-shadow: 0 8px 26px -8px rgba(46, 230, 138, 0.8);
  white-space: nowrap;
}
.open:hover { filter: brightness(1.08); }
.hint {
  color: var(--ink-dim); font-size: 12px; white-space: nowrap;
}
@media (max-width: 680px) {
  .hint { display: none; }
  .open { margin-left: 0; width: 100%; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* ---- the new mark, laid over the one baked into the artwork ----

   The artwork is a flat image, so a logo inside it cannot be swapped —
   it can only be covered. Two things make that invisible rather than
   obvious:

   The patch under each one is filled with the colour sampled from the
   pixels immediately around that mark in the artwork itself, so it
   matches what it replaces instead of being a guess at "dark blue".

   The mark is round, and it is the tight crop where the sphere fills
   the frame. A circle has no corners to mismatch, and the tight crop
   means the M is as large as it can be in the pixels available.

   It is served at 512px into slots between 36 and 72px, so it is only
   ever scaled DOWN. Nothing here upscales it and nothing filters it;
   that is the whole of not being blurry. */
.mark {
  position: absolute;
  display: block;
  border-radius: 50%;
  z-index: 2;
}
.patch {
  position: absolute;
  z-index: 1;
}

</style>

<p id="say" role="status" aria-live="polite"
   style="max-width:1671px;margin:14px auto 30px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:#6d7fa6;font-size:12px">
  The artwork is exactly as supplied. RankUp opens in a new tab.
</p>

<script>
(function () {
  var stages = [].slice.call(document.querySelectorAll('.stage'));
  var tabs = [].slice.call(document.querySelectorAll('.seg button'));
  var say = document.getElementById('say');
  var ALLOWED = ['home', 'console'];

  function show(screen) {
    if (ALLOWED.indexOf(screen) < 0) screen = 'home';
    stages.forEach(function (s) { s.hidden = s.getAttribute('data-screen') !== screen; });
    tabs.forEach(function (t) {
      t.setAttribute('aria-selected', String(t.getAttribute('data-screen') === screen));
    });
    try { history.replaceState(null, '', '#' + screen); } catch (e) { /* the hash is a nicety */ }
    window.scrollTo({ top: 0 });
  }

  document.addEventListener('click', function (e) {
    var tab = e.target.closest('[data-screen]');
    if (tab && tab.tagName === 'BUTTON') { show(tab.getAttribute('data-screen')); return; }

    var go = e.target.closest('[data-screen-go]');
    if (go) { show(go.getAttribute('data-screen-go')); return; }

    var soon = e.target.closest('[data-soon]');
    if (soon) {
      say.textContent = soon.getAttribute('data-soon') + ' is in the design but not built yet. RankUp is the one you can open.';
    }
  });

  var start = (location.hash || '').replace('#', '');
  show(ALLOWED.indexOf(start) >= 0 ? start : 'home');
})();
</script>
