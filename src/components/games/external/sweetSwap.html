<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sweet Swap — Match 3</title>
<style>
:root{--navy:#09285c;--blue:#087ce7;--cyan:#50e6ff;--pink:#ff4ecb;--gold:#ffd94b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;background:radial-gradient(ellipse at 50% 0%,#a8eaff 0,#4a9eff 38%,#5737c9 76%,#26145f 100%);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 30%,#fff8 0 2px,transparent 4px),radial-gradient(circle at 85% 18%,#fff9 0 3px,transparent 5px),radial-gradient(circle at 75% 75%,#ffb7ef99 0 3px,transparent 6px);background-size:140px 130px,190px 170px,220px 210px}.app{max-width:1100px;margin:auto;padding:16px;position:relative}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-weight:1000;font-size:clamp(25px,5vw,45px);line-height:.9;letter-spacing:-2px;text-shadow:0 4px 0 #8d31a4,0 7px 15px #14266b}.logo span{display:block;color:#ffec62;-webkit-text-stroke:1px #ff9b21}.pill{background:linear-gradient(#fff7,#fff1),#073b84;border:2px solid #8beaff;border-radius:16px;padding:9px 14px;box-shadow:0 5px 0 #06275e;white-space:nowrap;font-weight:800}.layout{display:grid;grid-template-columns:190px minmax(280px,600px) 150px;gap:14px;align-items:center;justify-content:center;margin-top:18px}.panel{background:linear-gradient(160deg,#164b98ee,#071d4df2);border:2px solid #7de9ff;border-radius:22px;padding:14px;box-shadow:0 8px 0 #09275b,0 0 25px #65dfff55}.stat{margin-bottom:12px}.label{font-size:12px;color:#9feaff;font-weight:900;letter-spacing:1px}.num{font-size:28px;font-weight:1000}.goalrow{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-weight:800}.goalicon{font-size:24px}.boardwrap{background:linear-gradient(145deg,#1488ef,#06285e);border:3px solid #89edff;border-radius:22px;padding:8px;box-shadow:0 10px 0 #07265b,0 0 30px #57e6ff8c;position:relative}.board{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;touch-action:manipulation}.cell{aspect-ratio:1;min-width:0;border-radius:10px;background:linear-gradient(145deg,#164b91,#0b2c63);border:1px solid #78caff33;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;user-select:none;transition:transform .12s,filter .12s;overflow:hidden}.cell:after{content:"";position:absolute;inset:2px 2px 45%;border-radius:8px;background:linear-gradient(#ffffff20,transparent);pointer-events:none}.cell.selected{outline:3px solid #fff;box-shadow:0 0 15px #fff;transform:scale(1.04)}.candy{font-size:clamp(19px,4vw,39px);filter:drop-shadow(0 3px 1px #0006);z-index:1;line-height:1}.cell.pop{animation:pop .25s ease forwards}.cell.bad{animation:shake .22s}.block{font-size:clamp(18px,3vw,30px);z-index:1}.special{position:absolute;right:2px;bottom:1px;font-size:10px;font-weight:1000;color:#fff;text-shadow:0 1px 3px #000}.footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}.scorebox{font-weight:900;font-size:18px}.progress{height:12px;background:#061a45;border-radius:20px;overflow:hidden;margin-top:5px;border:1px solid #76ddff}.bar{height:100%;width:0;background:linear-gradient(90deg,#50ff9d,#e4ff56);transition:width .3s}.power{display:flex;align-items:center;gap:9px;width:100%;padding:10px 8px;margin:6px 0;border:2px solid #72eaff;border-radius:15px;background:linear-gradient(145deg,#087de9,#163a9c);color:white;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #051f58}.power small{display:block;font-size:11px;font-weight:900;text-align:left}.power:active,button:active{transform:translateY(2px)}.power.active{outline:3px solid #ffed67;box-shadow:0 0 18px #ffed67}.btn{border:0;border-radius:13px;background:linear-gradient(#ffe96b,#ffad23);color:#59246e;font-weight:1000;padding:10px 13px;box-shadow:0 4px 0 #b65b17;cursor:pointer}.btn.blue{background:linear-gradient(#53e9ff,#087fe9);color:#fff;box-shadow:0 4px 0 #064d9d}.hint{text-align:center;font-size:12px;font-weight:700;color:#e5faff;margin:12px 0 0}.message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#061a45b8;border-radius:18px;z-index:5;padding:20px}.message.show{display:flex}.modal{background:linear-gradient(160deg,#1b73d6,#101a64);border:3px solid #9df2ff;border-radius:24px;padding:26px;text-align:center;box-shadow:0 8px 0 #071d50;max-width:330px}.modal h2{font-size:30px;margin:0 0 8px}.modal p{line-height:1.4}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-100px);background:#fff;color:#183a76;padding:10px 18px;border-radius:30px;font-weight:900;box-shadow:0 5px 20px #001b55aa;transition:transform .25s;z-index:10}.toast.show{transform:translateX(-50%) translateY(0)}@keyframes pop{to{transform:scale(.1) rotate(25deg);opacity:0}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media(max-width:800px){.layout{grid-template-columns:1fr;max-width:590px;margin:14px auto}.left{order:1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.left .stat{margin:0}.left .goals{grid-column:span 3;display:flex;justify-content:space-around}.center{order:2}.right{order:3;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}.power{margin:0;display:flex;justify-content:center;padding:8px 4px}.power small{display:none}.top{flex-wrap:wrap}.pill{padding:7px 10px}.app{padding:10px}.cell{border-radius:7px}.board{gap:3px}}
</style></head><body><div class="app"><header class="top"><div class="logo"><span>SWEET</span> SWAP</div><div class="pill">⭐ <span id="stars">0</span> stars</div><button class="btn blue" id="pauseBtn">Ⅱ Pause</button></header>
<div class="layout"><aside class="panel left"><div class="stat"><div class="label">LEVEL</div><div class="num" id="level">1</div></div><div class="stat"><div class="label">MOVES LEFT</div><div class="num" id="moves">25</div></div><div class="stat"><div class="label">SCORE</div><div class="num" id="score">0</div></div><div class="goals" style="display:block;width:100%"><div class="label">LEVEL GOALS</div><div class="goalrow"><span><span class="goalicon">💗</span> Hearts</span><span id="heartGoal">0/12</span></div><div class="goalrow"><span><span class="goalicon">🍫</span> Chocolate</span><span id="chocGoal">0/8</span></div><div class="goalrow"><span><span class="goalicon">🍥</span> Swirls</span><span id="swirlGoal">0/6</span></div></div></aside>
<main class="center"><div class="boardwrap"><div class="board" id="board" aria-label="Candy board"></div><div class="message" id="message"><div class="modal"><h2 id="modalTitle">Sweet!</h2><p id="modalText"></p><button class="btn" id="modalBtn">Continue</button></div></div></div><div class="footer"><div style="flex:1"><div class="label">STAR METER</div><div class="progress"><div class="bar" id="bar"></div></div></div><div class="scorebox">🏆 <span id="miniScore">0</span></div></div><p class="hint">Tap or drag two neighboring candies to swap. Match 3 or more!</p></main>
<aside class="panel right"><button class="power" data-power="hammer" title="Hammer"><span>🔨</span><small>HAMMER<br>3 left</small></button><button class="power" data-power="bomb" title="Color bomb"><span>🌈</span><small>COLOR BOMB<br>2 left</small></button><button class="power" data-power="shuffle" title="Shuffle"><span>🔀</span><small>SHUFFLE<br>2 left</small></button><button class="power" data-power="moves" title="Extra moves"><span>➕</span><small>+5 MOVES<br>1 left</small></button></aside></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
const N=8,types=['💗','⭐','💎','🍋','🍇','🍊'];const boardEl=document.getElementById('board');let grid=[],selected=null,score=0,moves=25,level=1,stars=0,goals={heart:0,choc:0,swirl:0},targets={heart:12,choc:8,swirl:6},powerMode=null,paused=false,ended=false,dragStart=null,powers={hammer:3,bomb:2,shuffle:2,moves:1};
const $=id=>document.getElementById(id);function randType(){return Math.floor(Math.random()*types.length)}function makeCandy(){return {type:randType(),special:null,block:null}}function randBlock(){return Math.random()<.105?(Math.random()<.65?'choc':'swirl'):null}
function initial(){grid=Array.from({length:N},()=>Array(N).fill(null));for(let r=0;r<N;r++)for(let c=0;c<N;c++){let t;do{t=randType()}while((c>=2&&grid[r][c-1]?.type===t&&grid[r][c-2]?.type===t)||(r>=2&&grid[r-1][c]?.type===t&&grid[r-2][c]?.type===t));grid[r][c]={type:t,special:null,block:null};} // add blockers, preserving a playable board
for(let i=0;i<9;i++){let r=1+Math.floor(Math.random()*6),c=Math.floor(Math.random()*8);if(!grid[r][c].block&&Math.random()<.75)grid[r][c].block='choc';else grid[r][c].block='swirl';}
render();updateUI();}
function render(){boardEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let cell=document.createElement('button');cell.className='cell';cell.type='button';cell.dataset.r=r;cell.dataset.c=c;let x=grid[r][c];if(x){if(x.block){cell.innerHTML=`<span class="block">${x.block==='choc'?'🍫':'🍥'}</span>`;cell.style.background=x.block==='choc'?'linear-gradient(145deg,#74401e,#321b31)':'linear-gradient(145deg,#a04ee8,#40218c)';}else{cell.innerHTML=`<span class="candy">${x.special==='striped'?'⚡':x.special==='bomb'?'🌈':types[x.type]}</span>${x.special?'<span class="special">✦</span>':''}`;}}if(selected&&selected.r===r&&selected.c===c)cell.classList.add('selected');cell.addEventListener('click',()=>tap(r,c));cell.addEventListener('pointerdown',e=>{dragStart={r,c,x:e.clientX,y:e.clientY};});cell.addEventListener('pointerup',e=>{if(!dragStart)return;let dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.abs(dx)>18||Math.abs(dy)>18){let rr=r,cc=c;if(Math.abs(dx)>Math.abs(dy))cc+=dx>0?1:-1;else rr+=dy>0?1:-1;if(valid(rr,cc))swap({r,c},{r:rr,c:cc});}dragStart=null;});boardEl.appendChild(cell);}}
function valid(r,c){return r>=0&&c>=0&&r<N&&c<N}function tap(r,c){if(paused||ended)return;if(powerMode){usePower(r,c);return}if(!selected){selected={r,c};render();return}if(selected.r===r&&selected.c===c){selected=null;render();return}if(Math.abs(selected.r-r)+Math.abs(selected.c-c)===1){swap(selected,{r,c});}else selected={r,c};render()}
function swap(a,b){if(paused||ended)return;let A=grid[a.r][a.c],B=grid[b.r][b.c];if(!A||!B||A.block||B.block){selected=null;render();return}[grid[a.r][a.c],grid[b.r][b.c]]=[B,A];selected=null;let hits=findMatches();if(!hits.size&&!(A.special||B.special)){[grid[a.r][a.c],grid[b.r][b.c]]=[A,B];render();toast('Match 3 or more candies!');return}moves--;if(A.special||B.special){if(A.special)activateSpecial(a.r,a.c,A);if(B.special)activateSpecial(b.r,b.c,B);hits=findMatches();}resolve(hits).then(()=>{updateUI();checkEnd();});updateUI();render()}
function findMatches(){let set=new Set();for(let r=0;r<N;r++){let start=0;while(start<N){let t=grid[r][start];if(!t||t.block){start++;continue}let end=start+1;while(end<N&&grid[r][end]&&!grid[r][end].block&&grid[r][end].type===t.type)end++;if(end-start>=3)for(let c=start;c<end;c++)set.add(r+','+c);start=end;}}for(let c=0;c<N;c++){let start=0;while(start<N){let t=grid[start][c];if(!t||t.block){start++;continue}let end=start+1;while(end<N&&grid[end][c]&&!grid[end][c].block&&grid[end][c].type===t.type)end++;if(end-start>=3)for(let r=start;r<end;r++)set.add(r+','+c);start=end;}}return set}
function activateSpecial(r,c,x){if(x.special==='bomb'){for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++)if(grid[rr][cc]&&!grid[rr][cc].block)grid[rr][cc]=null;}else{for(let cc=0;cc<N;cc++)if(grid[r][cc]&&!grid[r][cc].block)grid[r][cc]=null;for(let rr=0;rr<N;rr++)if(grid[rr][c]&&!grid[rr][c].block)grid[rr][c]=null;}x.special=null}
const wait=ms=>new Promise(res=>setTimeout(res,ms));async function resolve(hits){let loops=0;while(hits.size&&loops++<12){let cells=[...hits].map(k=>k.split(',').map(Number));let toClear=new Set(hits);for(let [r,c] of cells){let x=grid[r][c];if(!x||x.block)continue;if(x.type===0)goals.heart++;if(x.special)activateSpecial(r,c,x);if(x.type===2&&Math.random()<.15)x.special='striped';}for(let k of toClear){let [r,c]=k.split(',').map(Number);let x=grid[r][c];if(x&&!x.block){score+=60;grid[r][c]=null;for(let [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){let rr=r+dr,cc=c+dc;if(valid(rr,cc)&&grid[rr][cc]?.block){if(grid[rr][cc].block==='choc')goals.choc++;else goals.swirl++;grid[rr][cc]=null;score+=100;}}}}render();await wait(110);for(let c=0;c<N;c++){let write=N-1;for(let r=N-1;r>=0;r--)if(grid[r][c]){if(write!==r){grid[write][c]=grid[r][c];grid[r][c]=null}write--;}for(let r=write;r>=0;r--)grid[r][c]=makeCandy();}hits=findMatches();}render();updateUI()}
function updateUI(){$('level').textContent=level;$('moves').textContent=moves;$('score').textContent=score.toLocaleString();$('miniScore').textContent=score.toLocaleString();$('stars').textContent=stars;$('heartGoal').textContent=Math.min(goals.heart,targets.heart)+'/'+targets.heart;$('chocGoal').textContent=Math.min(goals.choc,targets.choc)+'/'+targets.choc;$('swirlGoal').textContent=Math.min(goals.swirl,targets.swirl)+'/'+targets.swirl;$('bar').style.width=Math.min(100,score/(level*5000)*100)+'%';document.querySelectorAll('.power').forEach(b=>{let p=b.dataset.power;b.classList.toggle('active',powerMode===p);let labels={hammer:`HAMMER<br>${powers[p]} left`,bomb:`COLOR BOMB<br>${powers[p]} left`,shuffle:`SHUFFLE<br>${powers[p]} left`,moves:`+5 MOVES<br>${powers[p]} left`};b.querySelector('small').innerHTML=labels[p];b.disabled=powers[p]<=0;b.style.opacity=b.disabled?.5:1;});}
function checkEnd(){if(goals.heart>=targets.heart&&goals.choc>=targets.choc&&goals.swirl>=targets.swirl){ended=true;stars++;showModal('LEVEL COMPLETE!','Sweet! You cleared the goals with '+score.toLocaleString()+' points.','Next Level',nextLevel);}else if(moves<=0){ended=true;showModal('OUT OF MOVES!','You scored '+score.toLocaleString()+' points. Give it another try!','Try Again',restart);}}
function showModal(title,text,btn,fn){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modalBtn').textContent=btn;$('modalBtn').onclick=fn;$('message').classList.add('show')}
function nextLevel(){level++;targets={heart:12+level*2,choc:6+level,swirl:5+Math.floor(level/2)};goals={heart:0,choc:0,swirl:0};moves=25;score=0;ended=false;$('message').classList.remove('show');initial();toast('Level '+level+' — let’s go!')}
function restart(){score=0;moves=25;goals={heart:0,choc:0,swirl:0};ended=false;paused=false;$('message').classList.remove('show');initial()}
function toast(msg){let t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),1600)}
document.querySelectorAll('.power').forEach(b=>b.addEventListener('click',()=>{if(paused||ended)return;let p=b.dataset.power;if(!powers[p])return;if(p==='shuffle'){powers[p]--;let candies=grid.flat().filter(x=>x&&!x.block);for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]&&!grid[r][c].block)grid[r][c]=candies.splice(Math.floor(Math.random()*candies.length),1)[0]||makeCandy();powerMode=null;selected=null;render();updateUI();toast('Candies shuffled!');return}if(p==='moves'){powers[p]--;moves+=5;powerMode=null;updateUI();toast('+5 moves!');return}powerMode=p;selected=null;updateUI();toast(p==='hammer'?'Tap a candy or blocker to smash it!':'Tap a candy to unleash the color bomb!')}));
function usePower(r,c){let p=powerMode;if(!p)return;let x=grid[r][c];if(!x){return}powers[p]--;powerMode=null;if(p==='hammer'){if(x.block){if(x.block==='choc')goals.choc++;else goals.swirl++;}else if(x.type===0)goals.heart++;grid[r][c]=null;score+=150;for(let rr=0;rr<N;rr++)if(!grid[rr][c]){for(let k=rr;k>0;k--)grid[k][c]=grid[k-1][c];grid[0][c]=makeCandy();}moves=Math.max(0,moves-1);resolve(findMatches()).then(()=>{updateUI();checkEnd()});}else if(p==='bomb'){let t=x.type;for(let rr=0;rr<N;rr++)for(let cc=0;cc<N;cc++){let y=grid[rr][cc];if(y&&!y.block&&y.type===t){if(y.type===0)goals.heart++;grid[rr][cc]=null;score+=60}}moves=Math.max(0,moves-1);for(let c=0;c<N;c++){let write=N-1;for(let rr=N-1;rr>=0;rr--)if(grid[rr][c]){grid[write--][c]=grid[rr][c]}for(let rr=write;rr>=0;rr--)grid[rr][c]=makeCandy()}resolve(findMatches()).then(()=>{updateUI();checkEnd()});}render();updateUI()}
$('pauseBtn').addEventListener('click',()=>{if(ended)return;paused=!paused;$('pauseBtn').textContent=paused?'▶ Resume':'Ⅱ Pause';if(paused)showModal('PAUSED','Take a break. Your candies will wait!','Resume',()=>{$('message').classList.remove('show');paused=false;$('pauseBtn').textContent='Ⅱ Pause'});else $('message').classList.remove('show')});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&paused){paused=false;$('message').classList.remove('show')}});initial();
})();
</script></body></html>
