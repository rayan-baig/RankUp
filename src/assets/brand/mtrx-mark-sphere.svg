<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="MTRX">
  <!--
    The MTRX mark, sphere version: the same folded M, standing inside the
    glowing globe from the hero image rather than in a rounded tile.
    Nothing here is a blurred bitmap — the glow is a soft radial fill and
    the globe is drawn latitude by latitude, so it stays sharp at any size
    and the file is a couple of kilobytes.

    It needs room to breathe, so this is the hero / header lockup. Below
    about 32px the globe collapses into haze and the badge version is the
    one to use.
  -->
  <defs>
    <radialGradient id="sx-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f7bff" stop-opacity="0.34"/>
      <stop offset="58%" stop-color="#6d3bff" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#6d3bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sx-face" x1="0.08" y1="0" x2="0.95" y2="1">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="42%" stop-color="#4f8bff"/>
      <stop offset="100%" stop-color="#c45cff"/>
    </linearGradient>
    <linearGradient id="sx-wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ff0ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#8a9bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#d06cff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="sx-orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ff0ff"/>
      <stop offset="50%" stop-color="#8a7bff"/>
      <stop offset="100%" stop-color="#d06cff"/>
    </linearGradient>

    <mask id="sx-m">
      <rect width="160" height="160" fill="#000"/>
      <path d="M52 108 L52 48 L80 88 L108 48 L108 108"
            fill="none" stroke="#fff" stroke-width="15"
            stroke-linejoin="miter" stroke-miterlimit="10"/>
    </mask>
    <mask id="sx-orbit-front">
      <rect x="0" y="86" width="160" height="74" fill="#fff"/>
    </mask>
  </defs>

  <circle cx="80" cy="80" r="78" fill="url(#sx-halo)"/>

  <!-- The globe: a rim, four latitudes and four meridians. A sphere is
       only ever the lines you can see on it. -->
  <g fill="none" stroke="url(#sx-wire)">
    <circle cx="80" cy="80" r="62" stroke-width="1.1" stroke-opacity="0.8"/>
    <ellipse cx="80" cy="80" rx="62" ry="15" stroke-width="0.8"/>
    <ellipse cx="80" cy="80" rx="62" ry="34" stroke-width="0.7" stroke-opacity="0.65"/>
    <ellipse cx="80" cy="80" rx="62" ry="52" stroke-width="0.6" stroke-opacity="0.45"/>
    <ellipse cx="80" cy="80" rx="15" ry="62" stroke-width="0.8"/>
    <ellipse cx="80" cy="80" rx="34" ry="62" stroke-width="0.7" stroke-opacity="0.65"/>
    <ellipse cx="80" cy="80" rx="52" ry="62" stroke-width="0.6" stroke-opacity="0.45"/>
  </g>
  <!-- Nodes scattered on the rim, the way the hero's sphere has them. -->
  <g fill="#8fd4ff">
    <circle cx="80" cy="18" r="1.5" opacity="0.9"/>
    <circle cx="124" cy="36" r="1.2" opacity="0.7"/>
    <circle cx="142" cy="80" r="1.5" opacity="0.85"/>
    <circle cx="124" cy="124" r="1.2" opacity="0.6"/>
    <circle cx="80" cy="142" r="1.4" opacity="0.8"/>
    <circle cx="36" cy="124" r="1.2" opacity="0.6"/>
    <circle cx="18" cy="80" r="1.5" opacity="0.85"/>
    <circle cx="36" cy="36" r="1.2" opacity="0.7"/>
  </g>

  <!-- Orbit, far half. -->
  <g transform="rotate(-18 80 88)" opacity="0.6">
    <ellipse cx="80" cy="88" rx="54" ry="19" fill="none" stroke="url(#sx-orbit)" stroke-width="2.4"/>
    <circle cx="29.3" cy="81.5" r="3.2" fill="#6ff0ff"/>
    <circle cx="121.4" cy="75.8" r="3.2" fill="#d06cff"/>
  </g>

  <g mask="url(#sx-m)">
    <rect width="160" height="160" fill="url(#sx-face)"/>
    <polygon points="52,42 60,42 60,116 52,116" fill="#ffffff" opacity="0.28"/>
    <polygon points="80,88 88,76 88,116 80,116" fill="#000000" opacity="0.24"/>
    <polygon points="100,42 108,42 108,116 100,116" fill="#000000" opacity="0.14"/>
    <polygon points="60,54 65,54 85,84 80,88" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- Orbit, near half. -->
  <g transform="rotate(-18 80 88)" mask="url(#sx-orbit-front)">
    <ellipse cx="80" cy="88" rx="54" ry="19" fill="none" stroke="url(#sx-orbit)" stroke-width="2.8"/>
    <circle cx="88" cy="106.8" r="6" fill="#6ff0ff" opacity="0.3"/>
    <circle cx="88" cy="106.8" r="3.6" fill="#9ff6ff"/>
  </g>
</svg>
